[build]
command = "npm run build"
functions = "netlify/functions"
publish = "dist"
  # Deploy-Credits sparen: ein Netlify-Production-Deploy kostet 15 Credits,
  # unabhaengig von der Buildzeit. Commits, die NUR CI-Workflows, Docs, Markdown
  # oder Tests aendern, loesen deshalb keinen Build aus.
  # Exit 0 = Build ueberspringen, Exit != 0 = bauen.
  # Guards: Ist CACHED_COMMIT_REF leer (kalter Cache, z.B. nach abgebrochenem
  # Build) oder gleich COMMIT_REF, MUSS gebaut werden. Ohne den Guard vergleicht
  # git diff den Commit mit dem eigenen Worktree (immer identisch, Exit 0) und
  # die Site kann nie wieder deployen.
  ignore = "test -n \"$CACHED_COMMIT_REF\" && test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude).github' ':(exclude)docs' ':(exclude)*.md' ':(exclude)tests'"

# Security Headers
[[headers]]
for = "/*"
[headers.values]
  X-Frame-Options = "DENY"
  X-XSS-Protection = "1; mode=block"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"

# Canonical host: redirect the Netlify subdomain to the custom domain
[[redirects]]
from = "https://stirring-otter-3510b8.netlify.app/*"
to = "https://hooka.hypeakz.io/:splat"
status = 301
force = true

# SPA fallback for all other routes
# (/.netlify/* is reserved by Netlify and passes through automatically)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
